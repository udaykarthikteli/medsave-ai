<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedSave AI — Your AI Companion for Public Health</title>
<meta name="description" content="MedSave AI: an AI-driven public health chatbot for disease awareness, prevention tips, and healthy living guidance.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="bg-canvas" data-icons="stethoscope,heart,shield,dna,cross,pill,dna,heart"></div>

<div class="scene">
  <nav class="navbar">
    <div class="brand">
      <div class="logo-mark"></div>
      <span class="brand-name">MedSave AI</span>
    </div>
    <div class="nav-actions">
      <a href="login.html" class="btn btn-ghost btn-sm">Log in</a>
      <a href="signup.html" class="btn btn-primary btn-sm">Sign up</a>
    </div>
  </nav>

  <main class="hero">
    <span class="hero-badge"><span class="dot"></span> AI-Driven Public Health Chatbot</span>
    <div class="logo-mark big" id="heroLogo"></div>
    <h1>Welcome to <span class="accent">MedSave AI</span></h1>
    <p class="tagline">Your AI Companion for Public Health Awareness and Disease Prevention.</p>

    <div class="hero-actions">
      <a href="login.html" class="btn btn-primary">Login</a>
      <a href="signup.html" class="btn btn-ghost">Sign Up</a>
    </div>

    <p class="hero-footnote">AI-Driven Public Health Chatbot for Disease Awareness · B.Tech Final Year Project</p>
  </main>
</div>

<script src="js/icons.js"></script>
<script src="js/background.js"></script>
<script>
  document.querySelectorAll('.logo-mark').forEach(el => el.innerHTML = msIcon('logo'));
</script>

</html>
