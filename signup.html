<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — MedSave AI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="bg-canvas" data-icons="dna,shield,cross,stethoscope"></div>

<div class="scene">
  <nav class="navbar">
    <a href="index.html" class="brand">
      <div class="logo-mark"></div>
      <span class="brand-name">MedSave AI</span>
    </a>
    <div class="nav-actions">
      <a href="login.html" class="btn btn-ghost btn-sm">Log in</a>
    </div>
  </nav>

  <main class="auth-wrap">
    <div class="auth-card glass">
      <div class="auth-head">
        <div class="logo-mark"></div>
        <h2>Create your account</h2>
        <p>Join MedSave AI for personalized health awareness and prevention guidance.</p>
      </div>

      <div class="form-alert" id="formAlert"></div>

      <form id="signupForm" novalidate>
        <div class="field">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="Your full name" autocomplete="name">
          <div class="hint" id="fullNameHint"></div>
        </div>
        <div class="field">
          <label for="signupEmail">Email</label>
          <input type="email" id="signupEmail" placeholder="you@example.com" autocomplete="email">
          <div class="hint" id="signupEmailHint"></div>
        </div>
        <div class="field">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" placeholder="At least 6 characters" autocomplete="new-password">
          <button type="button" class="field-toggle" onclick="togglePassword('signupPassword', this)">Show</button>
          <div class="hint" id="signupPasswordHint"></div>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password">
          <button type="button" class="field-toggle" onclick="togglePassword('confirmPassword', this)">Show</button>
          <div class="hint" id="confirmPasswordHint"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">Create Account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Log In</a></p>
    </div>
  </main>
</div>

<script src="js/icons.js"></script>
<script src="js/background.js"></script>
<script src="js/auth.js"></script>
<script>
  document.querySelectorAll('.logo-mark').forEach(el => el.innerHTML = msIcon('logo'));
</script>
</body>
</html>
